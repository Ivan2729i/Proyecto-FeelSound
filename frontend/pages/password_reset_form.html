<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restablecer Contraseña</title>

  <!-- Fuentes / estilos como en base -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CLI build + tus estilos -->
  <link rel="stylesheet" href="../static/css/output.css">
  <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body class="text-white">

  <div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-[#101A33] to-[#0A0F21] px-4">
    <div class="text-center mb-8">
      <h1 class="text-4xl md:text-5xl font-bold">¿Olvidaste tu Contraseña?</h1>
      <p class="mt-2 text-[#8e9bb5] text-base md:text-lg">
        No te preocupes. Ingresa tu email y te enviaremos un enlace para recuperarla.
      </p>
    </div>

    <div class="w-full max-w-md p-8 space-y-6 bg-[#2B3A5A]/50 backdrop-blur-xl rounded-2xl shadow-lg border border-[#3E4E71]">
      <form id="fs-reset-form" method="post" action="#" class="space-y-5">
        <!-- contenedor para errores por JS -->
        <div id="err-email" class="hidden p-3 bg-red-500/20 border border-red-500/50 text-red-400 text-sm rounded-lg"></div>

        <div>
          <label for="id_email" class="block mb-2 text-sm font-medium">Email</label>
          <input id="id_email" type="email" name="email" required placeholder="Ingresa tu correo"
                 class="w-full px-4 py-3 bg-[#2B3A5A] border border-[#3E4E71] rounded-lg
                        placeholder-[#8e9bb5] focus:outline-none focus:ring-2
                        focus:ring-[#4285F4] transition">
        </div>

        <button type="submit"
                class="btn-fs btn-fs--hover-purple w-full mt-6 py-3 font-bold text-white bg-[#4285F4] rounded-lg hover:bg-[#357AE8] transition">
          Enviar Enlace de Recuperación
        </button>
      </form>

      <div class="text-center mt-4">
        <a href="./login_register.html" class="link-underline text-sm text-text-muted hover:text-white">
          Volver a Iniciar Sesión
        </a>
      </div>
    </div>

    <!-- Toast stack -->
    <div id="fs-toast-stack"
         class="fixed top-8 left-1/2 -translate-x-1/2 z-[60] flex flex-col gap-3 pointer-events-none">
    </div>


  <script src="../static/js/config.js"></script>
  <script src="../static/js/main.js"></script>
  <script src="../static/js/password_reset.js"></script>

</body>
</html>
