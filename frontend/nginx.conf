server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Home: sirve el login directamente
  location = / {
    try_files /pages/login_register.html =404;
  }

  # /dashboard/ -> pages/dashboard.html
  location /dashboard/ {
    try_files /pages/dashboard.html =404;
  }

  # Acceso directo a /pages/*.html
  location /pages/ {
    try_files $uri =404;
  }

  # Estáticos
  location /static/ {
    try_files $uri =404;
    expires 7d;
    access_log off;
    add_header Cache-Control "public";
  }

  # Evita ruido por favicon
  location = /favicon.ico {
    try_files /static/img/favicon.ico =204;
    access_log off;
  }
}
