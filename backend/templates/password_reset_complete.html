{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contraseña Cambiada</title>

  <!-- Fuentes / estilos como en base -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CLI build + tus estilos -->
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="text-white">

  <div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-[#101A33] to-[#0A0F21] px-4">
    <div class="w-full max-w-md p-8 text-center bg-[#2B3A5A]/50 backdrop-blur-xl rounded-2xl shadow-lg border border-[#3E4E71]">
      <h1 class="text-2xl md:text-3xl font-bold">¡Contraseña Cambiada con Éxito! ✅</h1>
      <p class="mt-4 text-[#8e9bb5]">
        Tu contraseña ha sido actualizada. Ya puedes iniciar sesión.
      </p>
      <a  href="/#login"
         class="btn-fs btn-fs--hover-purple mt-8 inline-block px-6 py-3 font-bold rounded-lg bg-[#4285F4] hover:bg-[#357AE8]">
        Iniciar Sesión
      </a>
    </div>
  </div>

  <!-- Toast stack -->
  <div id="fs-toast-stack"
       class="fixed top-8 left-1/2 -translate-x-1/2 z-[60] flex flex-col gap-3 pointer-events-none">
  </div>


  <script src="{% static 'js/config.js' %}"></script>
  <script src="{% static 'js/main.js' %}"></script>

</body>
</html>
