{% load static %}
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Correo Enviado</title>

  <!-- Fuentes / estilos como en base -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind + tus estilos, usando static -->
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body class="text-white">

  <div class="flex items-center justify-center min-h-screen bg-gradient-to-br from-[#101A33] to-[#0A0F21] px-4">
    <div class="w-full max-w-md p-8 text-center bg-[#2B3A5A]/50 backdrop-blur-xl rounded-2xl shadow-lg border border-[#3E4E71]">
      <h1 class="text-2xl md:text-3xl font-bold">Revisa tu Correo ✉️</h1>
      <p class="mt-4 text-[#8e9bb5]">
        Te hemos enviado un correo con las instrucciones. Si no lo ves, revisa tu carpeta de spam.
      </p>

      <!-- vuelve al login principal -->
      <a href="/#login"
         class="mt-8 inline-block px-6 py-3 font-bold link-underline text-sm text-text-muted hover:text-white">
        Volver a Inicio
      </a>
    </div>
  </div>

  <!-- Toast stack -->
  <div id="fs-toast-stack"
       class="fixed top-8 left-1/2 -translate-x-1/2 z-[60] flex flex-col gap-3 pointer-events-none">
  </div>

  <!-- JS usando static -->
  <script src="{% static 'js/config.js' %}"></script>
  <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
